<DOCTYPE html>
<html lang = "en">
<head>
    <meta charset="UTF-8">
    <title>New Lecture</title>
</head>
<body>
    <h1>New Lecture</h1>
    <form action="/app/createLecture" method="post">
        {% csrf_token %}
        <label for="choice">Course:</label>
        <select id="choice" name="choice>
            {% for course in courses %}
                <option value="{{ course.name }}">{{ course.name }}</option>
            {% end for %}
        </select><br>
        <button type="submit">Create Lecture</button>
    </form>

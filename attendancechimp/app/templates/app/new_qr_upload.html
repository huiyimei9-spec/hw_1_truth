<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New QR Code Upload</title>
</head>
<body>
    <h1>New QR Code Upload</h1>
    <form action="/app/createQRCodeUpload" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <label for="imageUpload">QR code image:</label>
        <input type="file" id="imageUpload" name="imageUpload"><br>
        <button type="submit">Upload</button>
    </form>
